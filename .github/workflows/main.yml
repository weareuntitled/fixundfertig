# GitHub zeigt Secret-Werte nie an — nur Namen. Zum Ändern: Secret → Update → Wert neu eintragen.
#
# Erforderlich:
#   SSH_HOST   — nur IP oder Hostname, z. B. 76.13.4.77 (nicht "ssh root@…", kein User davor)
#   SSH_USER   — z. B. root
#   Private Key in SSH_PRIVATE_KEY (oder nur SERVER_SSH_KEY; Fallback siehe unten)
#
# SERVER_PORT ist hier nicht der SSH-Port (oft App-Port). SSH-Port bei Bedarf `port:` anpassen.

name: Deploy to Hostinger

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest ruff mypy

      - name: Check agent configuration is versioned
        run: git ls-files --error-unmatch AGENTS.md docs/agents/issue-tracker.md docs/agents/domain.md docs/agents/triage-labels.md docs/agents/development.md

      - name: Check Python correctness and PDF types
        run: |
          python -m ruff check --select E9,F63,F7,F82 app tests scripts
          python -m mypy --follow-imports=skip --ignore-missing-imports app/renderer.py app/services/invoice_pdf.py app/services/invoice_pdf_draw.py app/services/invoice_pdf_layout.py

      - name: Run backend tests
        run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests and production build
        working-directory: frontend
        env:
          APP_REVISION: ${{ github.sha }}
          VITE_APP_REVISION: ${{ github.sha }}
        run: |
          npm test
          npm run build
          npm run test:deploy-build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

  deploy:
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Bevorzugt SSH_PRIVATE_KEY; falls nur SERVER_SSH_KEY gepflegt ist, wird der genutzt.
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -eu
            cd ~/fixundfertig

            git fetch origin main
            if ! git diff --quiet -- . ':(exclude)backups/**' || ! git diff --cached --quiet -- . ':(exclude)backups/**'; then
              echo "Refusing deploy: tracked server changes exist outside backups/."
              git status --short
              exit 1
            fi
            untracked=$(git ls-files --others --exclude-standard | grep -v '^backups/' || true)
            if [ -n "$untracked" ]; then
              echo "Refusing deploy: untracked server files exist outside backups/."
              printf '%s\n' "$untracked"
              exit 1
            fi

            git checkout main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

            APP_REVISION="$(git rev-parse HEAD)" docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            for attempt in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' fixundfertig_app 2>/dev/null || true)
              if [ "$health" = healthy ]; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "App did not become healthy."
                docker compose -f docker-compose.prod.yml ps
                docker logs --tail 100 fixundfertig_app
                exit 1
              fi
              sleep 2
            done
            docker compose -f docker-compose.prod.yml ps
            test "$(docker exec fixundfertig_app printenv APP_REVISION)" = "$(git rev-parse HEAD)"
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' fixundfertig_app)" = "$(git rev-parse HEAD)"
            docker image prune -f
